<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code | Maths Concept Classes by FK Sir</title>
    <meta
      name="description"
      content="QR code for the quick links page of Maths Concept Classes by FK Sir."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5f1e8;
        --card: #ffffff;
        --text: #1e2430;
        --muted: #677184;
        --line: #e8dcc7;
        --shadow: 0 18px 42px rgba(39, 31, 16, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        color: var(--text);
        background: linear-gradient(180deg, #fffdf8 0%, var(--bg) 100%);
      }

      .wrap {
        width: min(560px, calc(100% - 24px));
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 0;
      }

      .card {
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 28px;
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.8rem, 5vw, 2.4rem);
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      #qrcode {
        display: grid;
        place-items: center;
        margin: 24px auto 18px;
        min-height: 280px;
      }

      .url {
        margin-top: 14px;
        font-size: 0.92rem;
        word-break: break-all;
      }

      .button {
        display: inline-block;
        margin-top: 20px;
        padding: 14px 18px;
        border-radius: 14px;
        text-decoration: none;
        color: #1e2430;
        font-weight: 700;
        border: 1px solid var(--line);
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <h1>Scan This QR</h1>
        <p>It opens the quick links page with Website, Enroll, WhatsApp, and YouTube.</p>
        <div id="qrcode"></div>
        <p class="url">https://maths-concept-classes.pages.dev/links.html</p>
        <a class="button" href="https://maths-concept-classes.pages.dev/links.html">Open Quick Links Page</a>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
      new QRCode(document.getElementById("qrcode"), {
        text: "https://maths-concept-classes.pages.dev/links.html",
        width: 280,
        height: 280,
        colorDark: "#111111",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H,
      });
    </script>
  </body>
</html>

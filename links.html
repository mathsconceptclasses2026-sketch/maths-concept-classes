<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Links | Maths Concept Classes by FK Sir</title>
    <meta
      name="description"
      content="Quick links for Maths Concept Classes by FK Sir. Open the website, enrollment form, WhatsApp, or YouTube channel."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5f1e8;
        --card: #ffffff;
        --text: #1e2430;
        --muted: #677184;
        --gold: #e2b33d;
        --green: #22c55e;
        --line: #e8dcc7;
        --shadow: 0 18px 42px rgba(39, 31, 16, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(226, 179, 61, 0.18), transparent 28%),
          linear-gradient(180deg, #fffdf8 0%, var(--bg) 100%);
      }

      .wrap {
        width: min(560px, calc(100% - 24px));
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 0;
      }

      .card {
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 28px;
        text-align: center;
      }

      .logo {
        width: 90px;
        height: 90px;
        object-fit: cover;
        border-radius: 18px;
        border: 2px solid rgba(226, 179, 61, 0.3);
      }

      h1 {
        margin: 16px 0 8px;
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .grid {
        display: grid;
        gap: 14px;
        margin-top: 24px;
      }

      .button {
        display: block;
        padding: 15px 18px;
        border-radius: 16px;
        text-decoration: none;
        color: var(--text);
        font-weight: 700;
        border: 1px solid var(--line);
        background: #fff;
      }

      .button.website {
        background: linear-gradient(135deg, #f7c957 0%, var(--gold) 100%);
      }

      .button.enroll {
        background: linear-gradient(135deg, #fff4d5 0%, #fff9ef 100%);
      }

      .button.whatsapp {
        background: linear-gradient(135deg, #22c55e 0%, #17a34a 100%);
        color: #fff;
      }

      .button.youtube {
        background: linear-gradient(135deg, #fff1ef 0%, #ffe2dd 100%);
      }

      .note {
        margin-top: 20px;
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <img class="logo" src="logo.jpeg" alt="Maths Concept Classes logo" />
        <h1>Maths Concept Classes by FK Sir</h1>
        <p>Choose what you want to open.</p>

        <div class="grid">
          <a class="button website" href="https://maths-concept-classes.pages.dev/">Open Website</a>
          <a
            class="button enroll"
            href="https://docs.google.com/forms/d/e/1FAIpQLSeyi8m3rraxZaYsCzaBlF_fvD7SgjYBzrrBfO2bOgqhU-t4zw/viewform"
          >
            Enroll Now
          </a>
          <a class="button whatsapp" href="https://wa.me/919335591380">Chat on WhatsApp</a>
          <a class="button youtube" href="https://www.youtube.com/@mathsconceptclasses2026">Watch YouTube</a>
        </div>

        <p class="note">Concepts First, Success Always!</p>
      </section>
    </main>
  </body>
</html>
